<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>超音波検査士 試験対策100</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#166534;--ng:#b91c1c;--accent:#0f766e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 12px 30px #0f172a22}
h1{font-size:26px;margin:0 0 7px}.hero p{margin:0;color:#dbeafe;line-height:1.65}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0f172a0c}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.catbtn,.modebtn,.choice,.primary,.ghost{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:16px;text-align:left;cursor:pointer}
.catbtn b{display:block;font-size:17px}.catbtn span{font-size:12px;color:var(--muted)}.catbtn:hover,.choice:hover{border-color:#0f766e}.primary{background:var(--accent);color:#fff;border:none;text-align:center;font-weight:700}.ghost{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 18px}.progress>div{height:100%;background:#0f766e;width:0}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#e6fffb;color:#115e59;font-size:12px;font-weight:700}.q{font-size:19px;line-height:1.6;font-weight:700;margin:13px 0}.choices{display:grid;gap:9px}.choice.selected{border:2px solid #0f766e;background:#f0fdfa}.choice.correct{border:2px solid #16a34a;background:#f0fdf4}.choice.wrong{border:2px solid #dc2626;background:#fef2f2}.choice:disabled{color:inherit;cursor:default}.feedback{margin-top:15px;border-radius:14px;padding:14px;line-height:1.65}.feedback.ok{background:#f0fdf4;color:#14532d}.feedback.ng{background:#fef2f2;color:#7f1d1d}.small{font-size:13px;color:var(--muted);line-height:1.6}.stat{font-size:34px;font-weight:800}.statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}.mini b{font-size:20px;display:block}.footer{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.statsgrid{grid-template-columns:1fr 1fr}.q{font-size:18px}.wrap{padding:10px}.hero{border-radius:18px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>超音波検査士 試験対策100</h1>
<p>全7臨床領域＋医用超音波の基礎。5択1答・5択2答に対応した、やや難しめのオリジナル演習問題です。</p>
</section>

<section id="home">
<div class="card">
<h2>領域を選ぶ</h2>
<div class="grid" id="catGrid"></div>
</div>
<div class="card">
<h2>出題モード</h2>
<div class="row">
<button class="modebtn" data-n="10"><b>10問演習</b><br><span class="small">選択領域からランダム</span></button>
<button class="modebtn" data-n="999"><b>全問演習</b><br><span class="small">選択領域をすべて出題</span></button>
</div>
<p class="small">先に領域を選んでください。「全領域ミックス」なら100問から出題します。</p>
</div>
<div class="card">
<h2>学習記録</h2>
<div id="overall" class="small"></div>
<button id="resetStats" class="ghost" style="margin-top:10px;width:100%">学習記録をリセット</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="topline"><span id="qcat"></span><span id="counter"></span></div>
<div class="progress"><div id="bar"></div></div>
<span class="badge" id="qtype"></span>
<div class="q" id="question"></div>
<div class="choices" id="choices"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="row" style="margin-top:14px">
<button id="check" class="primary">解答する</button>
<button id="next" class="primary hidden">次の問題</button>
</div>
<button id="quit" class="ghost" style="margin-top:10px;width:100%">トップへ戻る</button>
</div>
</section>

<section id="result" class="hidden">
<div class="card">
<h2>結果</h2>
<div class="stat" id="score"></div>
<p id="resultText"></p>
<div id="bycat"></div>
<div class="row" style="margin-top:15px">
<button id="retryWrong" class="primary">間違えた問題を復習</button>
<button id="backHome" class="ghost">トップへ</button>
</div>
</div>
</section>

<div class="footer">
※学習用のオリジナル問題です。日本超音波医学会の実際の試験問題を転載したものではありません。診断・診療の代替ではありません。基準値や判定基準は改訂されることがあるため、受験時は最新の公式ガイドライン・問題集も確認してください。
</div>
</div>

<script>
const BANK = [{"cat": "医用超音波の基礎", "type": "A", "q": "同一媒質中で超音波の周波数を高くしたとき、一般に正しい変化はどれか。", "choices": ["波長は長くなる", "減衰は小さくなる", "軸方向分解能は改善しやすい", "深部到達性は高くなる", "音速が比例して増加する"], "ans": [2], "exp": "同一媒質では音速はほぼ一定で、波長=音速/周波数。高周波ほど波長が短くなり、軸方向分解能は改善しやすい一方、減衰が増えて深部到達性は低下する。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "生体軟部組織中の平均音速として装置で一般に仮定される値に最も近いものはどれか。", "choices": ["330 m/s", "770 m/s", "1,540 m/s", "3,080 m/s", "15,400 m/s"], "ans": [2], "exp": "診断用超音波装置では軟部組織の平均音速を約1,540 m/sとして距離を計算する。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "パルス反射法で表示深度を2倍にした場合、他条件が同じなら最大パルス繰返し周波数(PRF)はどうなるか。", "choices": ["約2倍になる", "約4倍になる", "ほぼ変わらない", "約1/2になる", "約1/4になる"], "ans": [3], "exp": "深度が増すと次のパルス送信まで往復時間を長く取る必要がある。深度2倍なら最大PRFは概ね1/2となる。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "距離分解能（軸方向分解能）を直接改善する要因として最も適切なのはどれか。", "choices": ["ビーム幅を狭くする", "空間パルス長を短くする", "フレームレートを下げる", "ダイナミックレンジを広げる", "PRFを下げる"], "ans": [1], "exp": "軸方向分解能は主に空間パルス長で決まり、短いほど近接した2点を分離しやすい。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "方位分解能を最も左右するものはどれか。", "choices": ["パルス持続時間", "ビーム幅", "音速", "受信ゲイン", "グレースケール数"], "ans": [1], "exp": "方位分解能は主に超音波ビーム幅で決まる。焦点付近でビームが細いほど改善する。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "鏡面反射が最も強く得られやすい条件はどれか。", "choices": ["粗い境界面へ斜入射", "平滑な境界面へ垂直入射", "散乱体が波長より十分小さい", "周波数を下げるだけ", "受信ゲインを上げるだけ"], "ans": [1], "exp": "平滑で大きな境界面に対し超音波がほぼ垂直に入射すると、探触子方向へ強い鏡面反射が戻る。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "胆石の後方に生じる音響陰影の主因として最も適切なのはどれか。", "choices": ["屈折のみ", "多重反射のみ", "強い反射・吸収による後方へのエネルギー低下", "音速がゼロになるため", "PRF不足"], "ans": [2], "exp": "強い反射や吸収で石より深部へ進む音響エネルギーが減少し、後方が低エコーとなる。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "単純嚢胞の後方エコー増強が生じる主な理由はどれか。", "choices": ["嚢胞内で減衰が周囲より小さい", "嚢胞内で音速がゼロになる", "嚢胞壁で全反射する", "受信周波数が倍になる", "ドプラシフトが生じる"], "ans": [0], "exp": "液体内は周囲組織より減衰が小さく、後方に比較的強い音が届くため増強して見える。"}, {"cat": "医用超音波の基礎", "type": "X2", "q": "カラードプラでエイリアシングを軽減する方法として適切なものを2つ選べ。", "choices": ["PRF（スケール）を上げる", "送信周波数を上げる", "ベースラインを調整する", "観察深度を深くする", "壁フィルタを必ず最大にする"], "ans": [0, 2], "exp": "エイリアシング対策の基本はPRF/スケールを上げる、ベースラインをシフトする、送信周波数を下げる等。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "パルスドプラ法の特徴として正しいのはどれか。", "choices": ["任意深度の流速測定ができない", "高速血流でも原理上エイリアシングしない", "サンプルボリュームを設定して局所流速を評価できる", "方向情報は得られない", "連続波ドプラより距離分解能がない"], "ans": [2], "exp": "パルスドプラは任意深度にサンプルボリュームを設定できるが、ナイキスト限界により高速流ではエイリアシングが起こりうる。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "連続波ドプラ法がパルスドプラ法より優れる点はどれか。", "choices": ["測定深度を限定できる", "高速血流をエイリアシングなしで測定しやすい", "Bモード像を必ず同時表示できる", "低速血流のみ測れる", "距離分解能が高い"], "ans": [1], "exp": "連続波ドプラは深度選択性を持たない一方、非常に高い流速もエイリアシングなしで測定できる。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "ドプラ法で血流速度を過大評価しやすい設定はどれか。", "choices": ["実際より小さいドプラ入射角を入力する", "実際より大きいドプラ入射角を入力する", "PRFを上げる", "壁フィルタを下げる", "ゲインを下げる"], "ans": [1], "exp": "速度はcosθで補正される。実際より大きな角度を設定するとcosθが小さくなり、算出速度を過大評価しやすい。"}, {"cat": "医用超音波の基礎", "type": "X2", "q": "超音波の生体作用に関する指標として正しいものを2つ選べ。", "choices": ["MIは機械的作用の目安となる", "TIは熱的作用の目安となる", "MIは画像の横分解能を示す", "TIは組織音速を示す", "MIとTIはいずれも血流抵抗指数である"], "ans": [0, 1], "exp": "MI（Mechanical Index）は主に機械的作用、TI（Thermal Index）は主に温度上昇の可能性を示す指標。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "組織ハーモニックイメージングで期待される効果として最も適切なのはどれか。", "choices": ["サイドローブ等のアーチファクト低減", "必ず深部到達性が大幅に上がる", "ドプラ角度補正が不要になる", "音速誤差が完全に消失する", "全ての石灰化が消える"], "ans": [0], "exp": "ハーモニック成分を用いることで近距離の多重反射やサイドローブなどが抑制され、コントラスト分解能が改善することがある。"}, {"cat": "医用超音波の基礎", "type": "A", "q": "ダイナミックレンジを狭くしたBモード画像の変化として正しいのはどれか。", "choices": ["階調が増え軟らかい画像になる", "白黒コントラストが強い画像になる", "必ずフレームレートが上がる", "深度が増す", "音速が低下する"], "ans": [1], "exp": "ダイナミックレンジを狭くすると表示する階調幅が減り、白黒のコントラストが強調される。"}, {"cat": "医用超音波の基礎", "type": "X2", "q": "フレームレートを高くする方向に働く操作を2つ選べ。", "choices": ["表示深度を浅くする", "走査線密度を下げる", "焦点段数を増やす", "表示幅を広げる", "カラーボックスを広げる"], "ans": [0, 1], "exp": "浅い深度、少ない走査線、狭い視野、少ない焦点段数などは1フレーム当たりの送受信回数を減らしフレームレートを上げる。"}, {"cat": "消化器", "type": "A", "q": "急性胆嚢炎を示唆する超音波所見として最も特異度が高い組合せはどれか。", "choices": ["胆嚢腫大のみ", "胆泥のみ", "胆石とsonographic Murphy sign陽性", "胆嚢壁2 mm", "総胆管径4 mm"], "ans": [2], "exp": "胆石嵌頓を背景に圧痛点と探触子圧迫部位が一致するsonographic Murphy signは急性胆嚢炎を強く示唆する。"}, {"cat": "消化器", "type": "A", "q": "胆嚢腺筋腫症で特徴的な所見はどれか。", "choices": ["comet-tail artifact", "target sign", "pseudokidney sign", "floating membrane sign", "double duct sign"], "ans": [0], "exp": "Rokitansky–Aschoff sinus内の微小結石やコレステロール結晶に由来するcomet-tail artifactが特徴的。"}, {"cat": "消化器", "type": "A", "q": "肝硬変で門脈圧亢進を示唆する所見として適切なのはどれか。", "choices": ["脾腫", "胆嚢収縮", "膵管狭小化", "腎皮質菲薄化のみ", "肝静脈径の一様な増大のみ"], "ans": [0], "exp": "門脈圧亢進では脾腫、側副血行路、門脈径増大や血流変化などを認めうる。"}, {"cat": "消化器", "type": "A", "q": "典型的な肝血管腫のBモード所見として最も多いのはどれか。", "choices": ["境界明瞭な均一高エコー腫瘤", "内部無エコーで後方増強のみ", "必ずhaloを伴う低エコー腫瘤", "必ず石灰化を伴う", "門脈内腫瘍栓を伴う"], "ans": [0], "exp": "小型の典型的肝血管腫は境界明瞭で均一な高エコーを呈することが多い。非典型像もあるため総合評価が必要。"}, {"cat": "消化器", "type": "A", "q": "肝細胞癌で比較的特徴的な超音波所見はどれか。", "choices": ["mosaic patternや辺縁低エコー帯", "常に均一な無エコー", "必ず後方陰影", "胆嚢壁内comet-tail", "膵管内結石のみ"], "ans": [0], "exp": "HCCではモザイクパターン、辺縁低エコー帯、後方エコー増強、腫瘍内血流などがみられることがある。"}, {"cat": "消化器", "type": "X2", "q": "閉塞性黄疸で胆道閉塞部位推定に有用な所見を2つ選べ。", "choices": ["肝内胆管拡張の分布", "総胆管の拡張範囲", "脾静脈の呼吸性変動のみ", "腎髄質エコーのみ", "膀胱容量のみ"], "ans": [0, 1], "exp": "肝内・肝外胆管のどこまで拡張しているかを追跡することが閉塞レベル推定の基本となる。"}, {"cat": "消化器", "type": "A", "q": "膵頭部癌でみられることがあるdouble duct signとは何か。", "choices": ["主膵管と総胆管の同時拡張", "門脈と肝静脈の同時閉塞", "胆嚢と膀胱の同時拡張", "左右腎盂の同時拡張", "脾動脈と脾静脈の同時拡張"], "ans": [0], "exp": "膵頭部付近の病変で総胆管と主膵管が同時に拡張する所見をdouble duct signという。"}, {"cat": "消化器", "type": "A", "q": "急性膵炎でみられうる超音波所見として最も適切なのはどれか。", "choices": ["膵腫大と低エコー化", "膵の著明な萎縮のみ", "主膵管内ガスが必須", "常に高エコー腫瘤", "門脈血流の完全逆転が必須"], "ans": [0], "exp": "急性炎症・浮腫により膵が腫大し低エコー化することがある。ただし腸管ガスで描出困難な例も多い。"}, {"cat": "消化器", "type": "A", "q": "虫垂炎を疑う超音波所見として適切なのはどれか。", "choices": ["圧迫で容易に虚脱する細い管腔", "盲端を有する非圧縮性管状構造の腫大", "蠕動の強い小腸のみ", "胆嚢壁肥厚のみ", "脾腫のみ"], "ans": [1], "exp": "虫垂は盲端で、炎症時には腫大し非圧縮性となる。周囲脂肪織変化や糞石も参考になる。"}, {"cat": "消化器", "type": "A", "q": "腸重積で代表的な横断像はどれか。", "choices": ["target sign", "comet-tail sign", "WES sign", "seashore sign", "Mercedes-Benz sign"], "ans": [0], "exp": "腸管が重なり同心円状に見えるtarget/doughnut signが典型的。"}, {"cat": "消化器", "type": "A", "q": "脂肪肝を示唆する所見と  $("qcat").textContent=x.cat;$("counter").textContent=`${idx+1} / ${current.length}`;
 $("bar").style.width=`${(idx/current.length)*100}%`;
 $("qtype").textContent=x.type==="X2"?"X2タイプ：2つ選択":"Aタイプ：1つ選択";
 $("question").textContent=x.q;$("feedback").className="feedback hidden";
 $("check").classList.remove("hidden");$("next").classList.add("hidden");
 $("choices").innerHTML=x.choices.map((c,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(97+i)}. ${c}</button>`).join("");
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i, need=x.type==="X2"?2:1;
   if(selected.includes(i)){selected=selected.filter(v=>v!==i);b.classList.remove("selected")}
   else {if(need===1){selected=[];document.querySelectorAll(".choice").forEach(z=>z.classList.remove("selected"))}
     if(selected.length<need){selected.push(i);b.classList.add("selected")}
   }
 });
}
function same(a,b){return a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i])}
function check(){
 const x=current[idx],need=x.type==="X2"?2:1;
 if(selected.length!==need){alert(need===2?"2つ選んでください。":"1つ選んでください。");return}
 const ok=same(selected,x.ans);answers.push({cat:x.cat,ok});if(!ok)wrong.push(x);
 document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(x.ans.includes(i))b.classList.add("correct");else if(selected.includes(i))b.classList.add("wrong")});
 const f=$("feedback");f.className="feedback "+(ok?"ok":"ng");
 f.innerHTML=`<b>${ok?"正解！":"不正解"}</b><br>正解：${x.ans.map(i=>String.fromCharCode(97+i)).join("・")}<br>${x.exp}`;
 $("check").classList.add("hidden");$("next").classList.remove("hidden");
}
function next(){idx++; if(idx>=current.length)finish(); else show()}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 const good=answers.filter(x=>x.ok).length,pct=Math.round(good/answers.length*100);
 $("score").textContent=`${good} / ${answers.length}（${pct}%）`;
 $("resultText").textContent=pct>=80?"かなり仕上がっています。解説まで確認して知識を固定しましょう。":pct>=60?"合格圏を意識できる得点です。誤答分野を重点復習しましょう。":"弱点がはっきりする段階です。領域別に10問ずつ反復するのがおすすめです。";
 const map={};answers.forEach(a=>{map[a.cat]??={n:0,k:0};map[a.cat].n++;if(a.ok)map[a.cat].k++});
 $("bycat").innerHTML=Object.entries(map).map(([c,v])=>`<div class="small">${c}：${v.k}/${v.n}（${Math.round(v.k/v.n*100)}%）</div>`).join("");
 $("retryWrong").disabled=wrong.length===0;
 saveStats(good,answers.length);
}
function saveStats(k,n){let s=JSON.parse(localStorage.getItem("us_stats")||'{"k":0,"n":0,"runs":0}');s.k+=k;s.n+=n;s.runs++;localStorage.setItem("us_stats",JSON.stringify(s));renderStats()}
function renderStats(){let s=JSON.parse(localStorage.getItem("us_stats")||'{"k":0,"n":0,"runs":0}');$("overall").innerHTML=s.n?`累計 ${s.n}問 ／ 正解 ${s.k}問 ／ 正答率 ${Math.round(s.k/s.n*100)}% ／ 演習 ${s.runs}回`:"まだ学習記録はありません。"}
document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>start(+b.dataset.n));
$("check").onclick=check;$("next").onclick=next;$("quit").onclick=()=>location.reload();$("backHome").onclick=()=>location.reload();
$("retryWrong").onclick=()=>{if(!wrong.length)return;current=shuffle(wrong);idx=0;answers=[];wrong=[];$("result").classList.add("hidden");$("quiz").classList.remove("hidden");show()};
$("resetStats").onclick=()=>{if(confirm("学習記録をリセットしますか？")){localStorage.removeItem("us_stats");renderStats()}};
renderCats();renderStats();
</script>
</body></html>
